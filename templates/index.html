<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DURJOYS MOD | Account Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --input-bg: #1c273e;
            --accent-blue: #00d2ff;
            --accent-green: #00ffaa;
            --accent-red: #ff4757;
            --text-color: #ffffff;
            --border-color: #2a3a5c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.15);
        }

        .title {
            color: var(--accent-blue);
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 22px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #94a3b8;
            font-weight: 600;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }

        select:focus, input:focus {
            border-color: var(--accent-blue);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: var(--accent-blue);
            color: #000;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .btn-submit:hover {
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }

        .btn-submit:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status-box {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
            font-weight: 600;
        }

        .status-box.error {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
        }

        .status-box.success {
            background: rgba(0, 255, 170, 0.15);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
        }

        .result-box {
            margin-top: 20px;
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: none;
        }

        .result-box pre {
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            color: var(--accent-green);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-secondary {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(0, 210, 255, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">DURJOYS MOD</div>

    <div class="form-group">
        <label for="server">Select Server</label>
        <select id="server">
            <option value="BD">BD (Bangladesh)</option>
            <option value="IND">IND (India)</option>
            <option value="PK">PK (Pakistan)</option>
            <option value="SG">SG (Singapore)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="prefix">Name Prefix</label>
        <input type="text" id="prefix" value="DURJOY" placeholder="Enter name prefix">
    </div>

    <button class="btn-submit" id="genBtn" onclick="generateAccount()">Generate Account</button>

    <div class="status-box" id="statusBox"></div>

    <div class="result-box" id="resultBox">
        <pre id="output"></pre>
        <div class="action-btns">
            <button class="btn-secondary" onclick="copyAccount()">Copy Details</button>
        </div>
    </div>
</div>

<script>
let currentAccount = "";

async function generateAccount() {
    const btn = document.getElementById('genBtn');
    const statusBox = document.getElementById('statusBox');
    const resultBox = document.getElementById('resultBox');
    const output = document.getElementById('output');

    const server = document.getElementById('server').value;
    const prefix = document.getElementById('prefix').value;

    btn.innerText = "GENERATING...";
    btn.disabled = true;
    statusBox.style.display = "none";
    resultBox.style.display = "none";

    try {
        const response = await fetch('/api/generate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                region: server,
                prefix: prefix
            })
        });

        const res = await response.json();

        if (response.ok && res.success) {
            currentAccount = `Name: ${res.data.name}\nUID: ${res.data.uid}\nPassword: ${res.data.password}\nRegion: ${res.data.region}\nStatus: ${res.data.status}`;
            output.innerText = currentAccount;
            resultBox.style.display = "block";

            statusBox.className = "status-box success";
            statusBox.innerText = "✔ Account Created Successfully!";
            statusBox.style.display = "block";
        } else {
            throw new Error(res.error || "Failed to generate account");
        }

    } catch (err) {
        statusBox.className = "status-box error";
        statusBox.innerText = "❌ Connection failed!";
        statusBox.style.display = "block";
    }

    btn.innerText = "Generate Account";
    btn.disabled = false;
}

function copyAccount() {
    if (!currentAccount) return;
    navigator.clipboard.writeText(currentAccount);
    alert('Account details copied!');
}
</script>

</body>
</html>
